; Planula-ePaper: Corallite wireless gauge panel.
;   env:epaper      Waveshare e-Paper ESP32 Driver Board (Rev 3, ESP32-WROOM-32E)
;                   + Waveshare 7.5" B/W raw panel, 800x480 (V2)
;   env:reterminal  Seeed reTerminal E1001 (ESP32-S3, 8 MB PSRAM, 7.5" 800x480 B/W)
;
; Build:   pio run
; Flash:   pio run -t upload          (DIP switch 2 ON, switch 1 on A)
; Monitor: pio device monitor

[platformio]
default_envs = epaper

[env]
; Pinned: Arduino core 3.0.7 / IDF 5.1 via pioarduino, same as the Calyx nodes.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:version.py
    pre:tools/embed_web.py
; Git URLs, not the registry, so it builds from anywhere.
lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1
    https://github.com/adafruit/Adafruit_BusIO.git#1.16.2
    https://github.com/adafruit/Adafruit-GFX-Library.git#1.11.11
    https://github.com/ZinggJM/GxEPD2.git#1.6.2
build_flags =
    -Wall
    -DOTA_MANIFEST_URL=\"http://10.0.0.228:8000/firmware/planula-epaper/latest.json\"
    -DOTA_PASSWORD=\"${sysenv.CALYX_OTA_PASS}\"

[env:epaper]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DNODE_BOARD=\"waveshare-epaper-esp32-rev3\"
    -DFW_IMAGE=\"planula-epaper\"
    -Ilib/qrcodegen/src

; Same firmware over Wi-Fi from the Mac (needs CALYX_OTA_PASS, same as the running build).
[env:epaper-net]
extends = env:epaper
upload_protocol = espota
upload_port = planula-epaper-1.local
upload_flags =
    --auth=${sysenv.CALYX_OTA_PASS}
    --port=3232

; Seeed reTerminal E1001: ESP32-S3R8, 32 MB flash, 8 MB octal PSRAM, GDEY075T7
; panel on SCK 7 / MOSI 9 / CS 10 / DC 11 / RST 12 / BUSY 13 (microSD shares
; SCK/MOSI, its CS is GPIO14). Its own firmware image ("planula-epaper-s3"):
; update checks never offer it the ESP32 build, or the other way round.
; NOT YET RUN ON HARDWARE (written 2026-10-29 from Seeed's docs).
[env:reterminal]
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
; Its USB-C goes to a CH340 on UART0 (GPIO43/44), not the S3's own USB:
; Serial must be UART0 or the log goes nowhere.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    ${env.build_flags}
    -DNODE_BOARD=\"seeed-reterminal-e1001\"
    -DFW_IMAGE=\"planula-epaper-s3\"
    -DBOARD_RETERMINAL=1
    -DBOARD_HAS_PSRAM
    -Ilib/qrcodegen/src
